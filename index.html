<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团圈 · 发现与招募</title>
    <!-- Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #1e293b;
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .app-wrapper {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 头部区域 */
        .hero {
            background: linear-gradient(135deg, #0f2b5c 0%, #1e4a7a 100%);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            margin-bottom: 2.5rem;
            color: white;
            box-shadow: 0 15px 30px -10px rgba(0, 20, 50, 0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .hero h1 i {
            color: #ffd966;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 550px;
            margin-top: 0.5rem;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* 搜索与筛选栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 50px;
            padding: 0.4rem 0.4rem 0.4rem 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            flex: 1 1 300px;
            border: 1px solid #e2e8f0;
        }

        .search-box i {
            color: #94a3b8;
            margin-right: 0.6rem;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 1rem;
            padding: 0.8rem 0;
            width: 100%;
            background: transparent;
        }

        .search-box button {
            background: #1e4a7a;
            border: none;
            color: white;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .search-box button:hover {
            background: #0f2b5c;
        }

        .filter-tabs {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 0.6rem 1.3rem;
            border-radius: 40px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn i {
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: #1e4a7a;
            border-color: #1e4a7a;
            color: white;
        }

        .filter-btn:hover {
            background: #eef2f6;
        }

        .filter-btn.active:hover {
            background: #0f2b5c;
        }

        /* 主网格 */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 2.5rem 0 1.2rem;
        }

        .section-title h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f2b5c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            color: #64748b;
            font-size: 0.95rem;
            background: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 500;
        }

        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        .club-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem 1.5rem 1.3rem;
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9eef3;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .club-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(20, 50, 90, 0.12);
            border-color: #cbd5e1;
        }

        .card-header {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #d9e6f2, #c0d4e8);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #1e4a7a;
            flex-shrink: 0;
        }

        .club-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
            color: #0f2b5c;
            margin-bottom: 0.2rem;
        }

        .club-tag {
            display: inline-block;
            background: #eef6ff;
            color: #1e4a7a;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .club-desc {
            color: #475569;
            font-size: 0.92rem;
            margin: 0.75rem 0 1.1rem;
            line-height: 1.5;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            border-top: 1px solid #edf2f7;
            padding-top: 1rem;
        }

        .member-count {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .member-count i {
            color: #94a3b8;
        }

        .join-btn {
            background: #eef6ff;
            border: none;
            color: #1e4a7a;
            font-weight: 600;
            padding: 0.55rem 1.3rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }

        .join-btn i {
            font-size: 0.8rem;
        }

        .join-btn:hover {
            background: #1e4a7a;
            color: white;
        }

        .join-btn.joined {
            background: #d1fae5;
            color: #065f46;
            border-color: #a7f3d0;
            pointer-events: none;
            opacity: 0.9;
        }

        .join-btn.joined i {
            color: #059669;
        }

        /* 创建社团卡 (特殊样式) */
        .create-card {
            background: #ffffffd9;
            border: 2px dashed #b9c9db;
            box-shadow: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 240px;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            color: #4a6b8f;
        }

        .create-card i {
            font-size: 2.8rem;
            color: #1e4a7a;
            background: #e3edf9;
            padding: 1rem;
            border-radius: 50%;
        }

        .create-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f2b5c;
        }

        .create-card p {
            font-size: 0.9rem;
            color: #5f7d9c;
        }

        .create-card:hover {
            background: #e6f0fc;
            border-color: #1e4a7a;
        }

        /* 模态框（创建社团） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            padding: 1rem;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.4);
            transform: scale(0.95);
            transition: 0.2s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f2b5c;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal .sub {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.3rem;
            color: #1e293b;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            background: #f8fafc;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1e4a7a;
            box-shadow: 0 0 0 3px rgba(30, 74, 122, 0.15);
            background: white;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.8rem;
            justify-content: flex-end;
        }

        .btn {
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .btn-primary {
            background: #1e4a7a;
            color: white;
        }

        .btn-primary:hover {
            background: #0f2b5c;
        }

        .btn-secondary {
            background: #eef2f6;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* 卡片上的"查看详情"入口 */
        .view-detail {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1e4a7a;
            font-size: 0.85rem;
            font-weight: 600;
            margin: -0.3rem 0 0.9rem;
            width: fit-content;
        }

        .view-detail i {
            font-size: 0.75rem;
            transition: transform 0.2s;
        }

        .club-card:hover .view-detail i {
            transform: translateX(3px);
        }

        /* 社团详情弹窗 */
        .modal-lg {
            max-width: 720px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
        }

        .detail-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 38px;
            height: 38px;
            border: none;
            background: #eef2f6;
            color: #475569;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-close:hover {
            background: #e2e8f0;
            color: #0f2b5c;
        }

        .detail-header {
            display: flex;
            gap: 1.1rem;
            align-items: center;
            padding-right: 2.5rem;
            margin-bottom: 1.1rem;
        }

        .detail-avatar {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #d9e6f2, #c0d4e8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #1e4a7a;
            flex-shrink: 0;
        }

        .detail-header-info h2 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #0f2b5c;
            margin-bottom: 0.4rem;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .detail-meta .member-count {
            font-size: 0.88rem;
        }

        .detail-brief {
            background: #f8fafc;
            border-left: 3px solid #1e4a7a;
            color: #475569;
            padding: 0.8rem 1rem;
            border-radius: 0 0.8rem 0.8rem 0;
            font-size: 0.95rem;
            margin-bottom: 1.6rem;
        }

        .detail-section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .detail-section-title h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f2b5c;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-detail-btn {
            background: #eef6ff;
            border: 1px solid #cfe2f7;
            color: #1e4a7a;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .edit-detail-btn:hover {
            background: #1e4a7a;
            color: white;
            border-color: #1e4a7a;
        }

        .edit-detail-btn.saved {
            background: #d1fae5;
            border-color: #a7f3d0;
            color: #065f46;
        }

        .detail-body {
            background: #f8fafc;
            border: 1px solid #e9eef3;
            border-radius: 1rem;
            padding: 1.2rem 1.3rem;
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
        }

        .detail-empty {
            color: #94a3b8;
            text-align: center;
            padding: 1.2rem 0;
        }

        .detail-empty i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 0.6rem;
            color: #cbd5e1;
        }

        .detail-editor {
            width: 100%;
            min-height: 240px;
            padding: 1rem 1.1rem;
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.7;
            outline: none;
            resize: vertical;
            background: #f8fafc;
            font-family: inherit;
        }

        .detail-editor:focus {
            border-color: #1e4a7a;
            box-shadow: 0 0 0 3px rgba(30, 74, 122, 0.15);
            background: white;
        }

        .detail-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 0.9rem;
        }

        .detail-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.6rem;
            border-top: 1px solid #edf2f7;
            padding-top: 1.3rem;
        }

        .detail-footer .join-btn {
            padding: 0.7rem 2rem;
            font-size: 0.95rem;
        }

        /* 空状态 */
        .empty-message {
            grid-column: 1 / -1;
            background: white;
            padding: 3rem;
            text-align: center;
            border-radius: 1.5rem;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .empty-message i {
            font-size: 2.5rem;
            color: #b9c9db;
            margin-bottom: 1rem;
        }

        /* 页脚 */
        .footer {
            margin-top: 4rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 2rem;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .hero {
                padding: 1.8rem 1.5rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                flex: 1 1 auto;
            }
            .filter-tabs {
                justify-content: space-between;
            }
            .filter-btn {
                flex: 1;
                justify-content: center;
            }
            .section-title h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- 头部 -->
        <header class="hero">
            <div>
                <h1>
                    <i class="fas fa-users"></i> 社团圈
                </h1>
                <p>发现你热爱的，招募你相信的。校园社团，从这里开始。</p>
            </div>
            <div class="hero-badge">
                <i class="fas-regular fa-compass"></i> 已有 20+ 活跃社团
            </div>
        </header>

        <!-- 搜索和分类 -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索社团名称、关键词...">
                <button id="searchBtn"><i class="fas fa-arrow-right"></i> 搜索</button>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-btn active" data-category="all"><i class="fas fa-layer-group"></i> 全部</button>
                <button class="filter-btn" data-category="学术"><i class="fas fa-graduation-cap"></i> 学术</button>
                <button class="filter-btn" data-category="艺术"><i class="fas fa-palette"></i> 艺术</button>
                <button class="filter-btn" data-category="运动"><i class="fas fa-futbol"></i> 运动</button>
                <button class="filter-btn" data-category="科技"><i class="fas fa-microchip"></i> 科技</button>
            </div>
        </div>

        <!-- 发现社团 标题 -->
        <div class="section-title">
            <h2><i class="fas fa-compass" style="color: #1e4a7a;"></i> 发现社团</h2>
            <span id="clubCount">6 个社团</span>
        </div>

        <!-- 社团卡片网格 -->
        <div class="clubs-grid" id="clubsGrid">
            <!-- 动态由JS渲染，但会留一个创建卡片占位，保证布局 -->
        </div>

        <!-- 创建社团 标题 -->
        <div class="section-title" style="margin-top: 3rem;">
            <h2><i class="fas fa-plus-circle" style="color: #1e4a7a;"></i> 招募新成员</h2>
            <span>创建你的社团</span>
        </div>

        <!-- 创建社团卡片区域 (单独展示) -->
        <div class="clubs-grid" id="createSectionGrid">
            <div class="create-card" id="createClubCard">
                <i class="fas fa-plus"></i>
                <h3>创建新社团</h3>
                <p>把你有趣的想法变成现实，招募志同道合的伙伴</p>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <i class="fas fa-heart" style="color: #f97373;"></i> 社团圈 · 让大学生活更精彩
        </div>
    </div>

    <!-- 创建社团模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2><i class="fas fa-rocket" style="color: #1e4a7a;"></i> 创建社团</h2>
            <p class="sub">填写社团信息，开始招募成员</p>
            <form id="createClubForm">
                <div class="form-group">
                    <label>社团名称 *</label>
                    <input type="text" id="clubName" required placeholder="例如：星空天文社">
                </div>
                <div class="form-group">
                    <label>分类 *</label>
                    <select id="clubCategory" required>
                        <option value="学术">学术</option>
                        <option value="艺术">艺术</option>
                        <option value="运动">运动</option>
                        <option value="科技">科技</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>简短描述 *</label>
                    <textarea id="clubDescription" rows="3" required placeholder="介绍一下社团的宗旨、活动内容..."></textarea>
                </div>
                <div class="form-group">
                    <label>详细介绍（选填，创建后也可以随时补充编辑）</label>
                    <textarea id="clubDetail" rows="5" placeholder="可以分段填写：社团宗旨、常规活动、招新要求、活动时间、联系方式等..."></textarea>
                </div>
                <div class="form-group">
                    <label>图标 (可选)</label>
                    <select id="clubIcon">
                        <option value="fa-star">⭐ 星星</option>
                        <option value="fa-music">🎵 音乐</option>
                        <option value="fa-code">💻 代码</option>
                        <option value="fa-camera">📷 摄影</option>
                        <option value="fa-heart">❤️ 爱心</option>
                        <option value="fa-basketball">🏀 篮球</option>
                        <option value="fa-palette">🎨 艺术</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>

    <!-- 社团详情弹窗 -->
    <div class="modal-overlay" id="detailOverlay">
        <div class="modal modal-lg">
            <button class="detail-close" id="detailCloseBtn" title="关闭">
                <i class="fas fa-xmark"></i>
            </button>
            <div class="detail-header">
                <div class="detail-avatar" id="detailAvatar">
                    <i class="fas fa-star"></i>
                </div>
                <div class="detail-header-info">
                    <h2 id="detailName">社团名称</h2>
                    <div class="detail-meta">
                        <span class="club-tag" id="detailCategory">分类</span>
                        <span class="member-count">
                            <i class="fas fa-user-group"></i>
                            <span id="detailMembers">0</span> 人
                        </span>
                    </div>
                </div>
            </div>

            <p class="detail-brief" id="detailBrief"></p>

            <div class="detail-section-title">
                <h3><i class="fas fa-align-left" style="color:#1e4a7a;"></i> 社团详细介绍</h3>
                <button class="edit-detail-btn" id="editDetailBtn">
                    <i class="fas fa-pen"></i> 编辑介绍
                </button>
            </div>

            <!-- 展示态 -->
            <div class="detail-body" id="detailBody"></div>

            <!-- 编辑态 -->
            <div id="detailEditArea" hidden>
                <textarea class="detail-editor" id="detailEditor" placeholder="在这里填写社团详细介绍，可以分段写：&#10;【社团宗旨】...&#10;【常规活动】...&#10;【招新要求】...&#10;【活动时间】...&#10;【联系方式】..."></textarea>
                <div class="detail-edit-actions">
                    <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
                    <button class="btn btn-primary" id="saveDetailBtn">保存介绍</button>
                </div>
            </div>

            <div class="detail-footer">
                <button class="join-btn" id="detailJoinBtn">
                    <i class="fas fa-plus-circle"></i> 加入社团
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 初始数据 ----------
            const initialClubs = [
                {
                    id: 'c1',
                    name: '星空天文社',
                    category: '学术',
                    description: '每周观测星空，学习天文知识，一起探索宇宙的奥秘。',
                    members: 42,
                    icon: 'fa-star',
                    joined: false,
                    detail: '【社团宗旨】\n面向所有对星空感到好奇的同学，无论零基础还是有经验的爱好者，都能在这里找到属于自己的那片星空。\n\n【常规活动】\n· 每周五晚校园观星会：望远镜实操、四季星座辨认\n· 每月一次天文主题分享会：宇宙学、航天探测、流星雨观测等\n· 学期末郊外观星露营，整夜守候银河与日出\n\n【招新要求】\n只要对星空有热情即可，无需任何基础；望远镜等器材由社团统一提供。\n\n【活动时间】每周五 19:30 · 物理楼楼顶平台\n【联系方式】QQ群：123456789（公众号：星空天文社）'
                },
                {
                    id: 'c2',
                    name: '弦音吉他社',
                    category: '艺术',
                    description: '零基础教学，草地音乐节，用琴弦震动青春。',
                    members: 68,
                    icon: 'fa-music',
                    joined: false,
                    detail: '【社团宗旨】\n让每一把吉他都不再吃灰，让每一份热爱都有回响。\n\n【常规活动】\n· 每周二、四晚零基础吉他教学：持琴姿势、和弦转换、流行弹唱\n· 每月一次"草地音乐夜"露天路演，欢迎带朋友来听\n· 年末专场音乐会，优秀社员可登台演出\n\n【招新要求】\n不限基础，零基础友好；可自带吉他，也可借用社团公用琴。\n\n【活动时间】每周二、四 19:00 · 大学生活动中心 302\n【联系方式】微信：xianyin2026'
                },
                {
                    id: 'c3',
                    name: 'Byte 编程俱乐部',
                    category: '科技',
                    description: '一起写代码、做项目、参加黑客松，技术改变世界。',
                    members: 93,
                    icon: 'fa-code',
                    joined: false,
                    detail: '【社团宗旨】\n用代码创造有趣的东西，在真实项目里快速成长。\n\n【常规活动】\n· 每周技术分享：前端、后端、算法、AI 应用等方向轮换\n· 组队开发实战项目，优秀作品帮助部署上线\n· 组织参加校级黑客松及全国大学生程序设计竞赛，往届多人获奖\n\n【招新要求】\n· 对编程有兴趣，专业不限，欢迎文科同学跨专业加入\n· 活动以动手实践为主，请携带自己的电脑\n\n【活动时间】每周三 18:30 · 计算机学院实验室 B201\n【联系方式】QQ群：987654321'
                },
                {
                    id: 'c4',
                    name: '追光摄影协会',
                    category: '艺术',
                    description: '人像、风光、街拍，用镜头记录校园与城市。',
                    members: 57,
                    icon: 'fa-camera',
                    joined: false,
                    detail: '【社团宗旨】\n用镜头记录生活，让光影替你说话。\n\n【常规活动】\n· 每两周一次主题外拍：人像、风光、街拍、夜景轮换进行\n· 后期修图 Workshop：Lightroom 调色与手机修图技巧\n· 学期末举办校园摄影展，优秀作品统一打印展出\n\n【招新要求】\n手机、相机均可参加；社团提供部分单反及镜头供社员借用。\n\n【活动时间】隔周周六 14:00 · 艺术楼门口集合\n【联系方式】小红书：@追光摄影'
                },
                {
                    id: 'c5',
                    name: '晨跑&篮球联盟',
                    category: '运动',
                    description: '晨跑打卡、篮球友谊赛，一起挥洒汗水。',
                    members: 84,
                    icon: 'fa-basketball',
                    joined: false,
                    detail: '【社团宗旨】\n用运动开启每一天，在汗水里交到真朋友。\n\n【常规活动】\n· 每周一至周五 6:40 操场晨跑打卡，全勤可获学期运动奖品\n· 每周六下午篮球 3v3 / 5v5 友谊赛，按水平分队\n· 每学期举办一次院系篮球联赛，欢迎组队报名\n\n【招新要求】\n身体健康、热爱运动即可，运动强度自选，不勉强、不内卷。\n\n【集合地点】学校东操场 / 体育馆篮球场\n【联系方式】微信群请添加社长微信：runhoops'
                },
                {
                    id: 'c6',
                    name: '益行志愿者协会',
                    category: '其他',
                    description: '社区服务、支教、环保，用行动温暖世界。',
                    members: 112,
                    icon: 'fa-heart',
                    joined: false,
                    detail: '【社团宗旨】\n点滴行动，温暖他人，也成就自己。\n\n【常规活动】\n· 周末社区敬老陪伴与小学生课业辅导\n· 寒暑假乡村支教项目，可开具社会实践证明\n· 校园环保日、旧衣募捐、公益跑等品牌活动\n\n【招新要求】\n有责任心、有耐心，能保证每月至少参加一次志愿活动。\n\n【福利说明】志愿服务时长可计入第二课堂学分\n【报名咨询】QQ群：202619999'
                }
            ];

            // ---------- 本地持久化 ----------
            const STORAGE_KEY = 'clubCircleClubs_v1';

            function loadClubs() {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                    if (Array.isArray(saved) && saved.length) {
                        // 补全可能缺失的字段，兼容旧数据
                        return saved.map(c => ({
                            detail: '',
                            ...c
                        }));
                    }
                } catch (e) { /* 数据损坏时回退到初始数据 */ }
                return initialClubs.map(c => ({ ...c }));
            }

            function saveClubs() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(clubs));
                } catch (e) { /* 存储不可用时静默失败 */ }
            }

            // 当前状态
            let clubs = loadClubs();
            let activeCategory = 'all';
            let searchQuery = '';

            // DOM 元素
            const clubsGrid = document.getElementById('clubsGrid');
            const clubCountSpan = document.getElementById('clubCount');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const filterTabs = document.getElementById('filterTabs');
            const createClubCard = document.getElementById('createClubCard');
            const modalOverlay = document.getElementById('modalOverlay');
            const cancelBtn = document.getElementById('cancelBtn');
            const createClubForm = document.getElementById('createClubForm');

            // 详情弹窗元素
            const detailOverlay = document.getElementById('detailOverlay');
            const detailCloseBtn = document.getElementById('detailCloseBtn');
            const detailAvatar = document.getElementById('detailAvatar');
            const detailName = document.getElementById('detailName');
            const detailCategory = document.getElementById('detailCategory');
            const detailMembers = document.getElementById('detailMembers');
            const detailBrief = document.getElementById('detailBrief');
            const detailBody = document.getElementById('detailBody');
            const editDetailBtn = document.getElementById('editDetailBtn');
            const detailEditArea = document.getElementById('detailEditArea');
            const detailEditor = document.getElementById('detailEditor');
            const cancelEditBtn = document.getElementById('cancelEditBtn');
            const saveDetailBtn = document.getElementById('saveDetailBtn');
            const detailJoinBtn = document.getElementById('detailJoinBtn');

            // 当前打开详情的社团 id
            let currentDetailId = null;

            // ---------- 工具函数 ----------
            // 获取图标 class (full)
            function getIconClass(iconName) {
                // 如果iconName 包含了 'fa-' 就直接使用，否则默认
                if (iconName && iconName.startsWith('fa-')) {
                    return `fas ${iconName}`;
                }
                return 'fas fa-users'; // fallback
            }

            // 过滤并排序俱乐部
            function getFilteredClubs() {
                let filtered = clubs.filter(club => {
                    // 分类筛选
                    if (activeCategory !== 'all') {
                        // 特殊处理：运动、科技等已经在数据里按字符串匹配
                        if (activeCategory === '运动' && club.category !== '运动') return false;
                        if (activeCategory === '科技' && club.category !== '科技') return false;
                        if (activeCategory === '艺术' && club.category !== '艺术') return false;
                        if (activeCategory === '学术' && club.category !== '学术') return false;
                        // 对于“其他”分类，不属于以上学术/艺术/运动/科技
                        if (activeCategory === '其他') {
                            const known = ['学术', '艺术', '运动', '科技'];
                            if (known.includes(club.category)) return false;
                        }
                    }
                    // 搜索
                    if (searchQuery.trim() !== '') {
                        const query = searchQuery.trim().toLowerCase();
                        return club.name.toLowerCase().includes(query) || 
                               club.description.toLowerCase().includes(query) ||
                               club.category.toLowerCase().includes(query);
                    }
                    return true;
                });
                return filtered;
            }

            // 更新俱乐部计数
            function updateClubCount(count) {
                clubCountSpan.textContent = `${count} 个社团`;
            }

            // 渲染社团卡片
            function renderClubs() {
                const filtered = getFilteredClubs();
                updateClubCount(filtered.length);

                if (filtered.length === 0) {
                    clubsGrid.innerHTML = `
                        <div class="empty-message">
                            <i class="fas fa-search"></i>
                            <h3>没有找到匹配的社团</h3>
                            <p>试试其他关键词或分类，或者创建一个新社团吧！</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                filtered.forEach(club => {
                    const iconClass = getIconClass(club.icon);
                    const joinedClass = club.joined ? 'joined' : '';
                    const joinedText = club.joined ? '已加入' : '加入社团';
                    const joinedIcon = club.joined ? 'fa-check-circle' : 'fa-plus-circle';

                    html += `
                        <div class="club-card" data-id="${club.id}">
                            <div class="card-header">
                                <div class="avatar">
                                    <i class="${iconClass}"></i>
                                </div>
                                <div class="club-info">
                                    <h3>${escapeHtml(club.name)}</h3>
                                    <span class="club-tag">${escapeHtml(club.category)}</span>
                                </div>
                            </div>
                            <p class="club-desc">${escapeHtml(club.description)}</p>
                            <span class="view-detail">查看详情 <i class="fas fa-chevron-right"></i></span>
                            <div class="card-footer">
                                <div class="member-count">
                                    <i class="fas fa-user-group"></i> ${club.members} 人
                                </div>
                                <button class="join-btn ${joinedClass}" data-id="${club.id}" ${club.joined ? 'disabled' : ''}>
                                    <i class="fas ${joinedIcon}"></i> ${joinedText}
                                </button>
                            </div>
                        </div>
                    `;
                });
                clubsGrid.innerHTML = html;

                // 重新绑定加入按钮事件
                document.querySelectorAll('.join-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        joinClub(id);
                    });
                });

                // 点击卡片其他区域 -> 打开社团详情
                document.querySelectorAll('.club-card').forEach(card => {
                    card.addEventListener('click', function() {
                        openClubDetail(this.dataset.id);
                    });
                });
            }

            // 简单的防XSS
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 加入社团逻辑
            function joinClub(clubId) {
                const club = clubs.find(c => c.id === clubId);
                if (club && !club.joined) {
                    club.joined = true;
                    club.members += 1;  // 增加成员数
                    saveClubs();
                    renderClubs();
                    // 如果详情弹窗正打开着，同步按钮和人数
                    if (currentDetailId === clubId) {
                        renderClubDetail(club);
                    }
                }
            }

            // ---------- 社团详情：查看 / 编辑详细介绍 ----------

            function openClubDetail(clubId) {
                const club = clubs.find(c => c.id === clubId);
                if (!club) return;
                currentDetailId = clubId;
                renderClubDetail(club);
                exitEditMode();
                detailOverlay.classList.add('active');
            }

            function closeClubDetail() {
                detailOverlay.classList.remove('active');
                currentDetailId = null;
            }

            // 渲染详情内容（每次数据变化后可重复调用）
            function renderClubDetail(club) {
                detailAvatar.querySelector('i').className = getIconClass(club.icon);
                detailName.textContent = club.name;
                detailCategory.textContent = club.category;
                detailMembers.textContent = club.members;
                detailBrief.textContent = club.description;

                // 详细介绍：用 textContent 填充，CSS 的 white-space:pre-wrap 保留换行
                if (club.detail && club.detail.trim() !== '') {
                    detailBody.textContent = club.detail;
                } else {
                    detailBody.innerHTML =
                        '<div class="detail-empty"><i class="fas fa-file-lines"></i>'
                        + '还没有填写详细介绍<br>点击右上角"编辑介绍"来补充内容吧</div>';
                }

                // 加入按钮状态
                if (club.joined) {
                    detailJoinBtn.className = 'join-btn joined';
                    detailJoinBtn.disabled = true;
                    detailJoinBtn.innerHTML = '<i class="fas fa-check-circle"></i> 已加入';
                } else {
                    detailJoinBtn.className = 'join-btn';
                    detailJoinBtn.disabled = false;
                    detailJoinBtn.innerHTML = '<i class="fas fa-plus-circle"></i> 加入社团';
                }

                // 重置编辑按钮（防止"已保存"状态残留）
                editDetailBtn.classList.remove('saved');
                editDetailBtn.innerHTML = '<i class="fas fa-pen"></i> 编辑介绍';
            }

            function enterEditMode() {
                const club = clubs.find(c => c.id === currentDetailId);
                if (!club) return;
                detailEditor.value = club.detail || '';
                detailBody.hidden = true;
                detailEditArea.hidden = false;
                editDetailBtn.style.display = 'none';
                setTimeout(() => detailEditor.focus(), 0);
            }

            function exitEditMode() {
                detailEditArea.hidden = true;
                detailBody.hidden = false;
                editDetailBtn.style.display = '';
            }

            function saveClubDetail() {
                const club = clubs.find(c => c.id === currentDetailId);
                if (!club) return;
                club.detail = detailEditor.value.trim();
                saveClubs();
                renderClubDetail(club);
                exitEditMode();

                // 轻量保存反馈
                editDetailBtn.classList.add('saved');
                editDetailBtn.innerHTML = '<i class="fas fa-check"></i> 已保存';
                setTimeout(() => {
                    editDetailBtn.classList.remove('saved');
                    editDetailBtn.innerHTML = '<i class="fas fa-pen"></i> 编辑介绍';
                }, 1800);
            }

            // 重置筛选和搜索 (并不重置数据)
            function resetFilters() {
                activeCategory = 'all';
                searchQuery = '';
                searchInput.value = '';
                // 更新按钮激活样式
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if (btn.dataset.category === 'all') {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            // 初始化/渲染 (首次)
            renderClubs();

            // ---------- 事件监听 ----------

            // 分类过滤
            filterTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                const category = btn.dataset.category;
                activeCategory = category;

                // 更新按钮样式
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 如果切换分类，保留搜索词 (不重置搜索)
                renderClubs();
            });

            // 搜索按钮
            searchBtn.addEventListener('click', () => {
                searchQuery = searchInput.value;
                renderClubs();
            });

            // 输入框支持回车搜索
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchQuery = searchInput.value;
                    renderClubs();
                }
            });

            // 创建社团卡片点击 -> 打开模态框
            createClubCard.addEventListener('click', () => {
                modalOverlay.classList.add('active');
            });

            // 取消按钮 / 点击遮罩关闭
            cancelBtn.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
            });

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });

            // ---------- 详情弹窗事件 ----------

            detailCloseBtn.addEventListener('click', closeClubDetail);

            detailOverlay.addEventListener('click', (e) => {
                if (e.target === detailOverlay) {
                    closeClubDetail();
                }
            });

            editDetailBtn.addEventListener('click', enterEditMode);
            cancelEditBtn.addEventListener('click', exitEditMode);
            saveDetailBtn.addEventListener('click', saveClubDetail);

            // 详情弹窗内点击"加入社团"
            detailJoinBtn.addEventListener('click', () => {
                if (currentDetailId) joinClub(currentDetailId);
            });

            // Esc 关闭任意打开的弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailOverlay.classList.contains('active')) {
                        closeClubDetail();
                    } else if (modalOverlay.classList.contains('active')) {
                        modalOverlay.classList.remove('active');
                    }
                }
            });

            // 提交创建社团表单
            createClubForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const name = document.getElementById('clubName').value.trim();
                const category = document.getElementById('clubCategory').value;
                const description = document.getElementById('clubDescription').value.trim();
                const detail = document.getElementById('clubDetail').value.trim();
                const iconSelect = document.getElementById('clubIcon');
                const icon = iconSelect.value; // 例如 'fa-star'

                if (!name || !description) {
                    alert('请填写社团名称和描述');
                    return;
                }

                // 创建新社团对象
                const newClub = {
                    id: 'c' + Date.now() + Math.random().toString(36).substr(2, 4),
                    name: name,
                    category: category,
                    description: description,
                    detail: detail,       // 详细介绍（可为空，之后在详情页补充）
                    members: 1,          // 创建者自己算一个成员
                    icon: icon,
                    joined: true         // 创建者默认已加入
                };

                // 添加到数组并持久化
                clubs.push(newClub);
                saveClubs();

                // 重置表单
                createClubForm.reset();

                // 关闭模态框
                modalOverlay.classList.remove('active');

                // 如果当前分类与新建社团不符，可能看不到。但可以重置筛选到全部，并清空搜索
                resetFilters(); // 重置为全部、清空搜索

                // 重新渲染
                renderClubs();

                // 滚动到社团区域，让用户看到自己的新社团
                document.querySelector('.section-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
